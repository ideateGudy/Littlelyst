<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="littlelystGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="littlelystBag" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle card -->
  <rect x="5" y="5" width="90" height="90" rx="26" fill="url(#littlelystGrad)" fill-opacity="0.15" stroke="url(#littlelystGrad)" stroke-width="2" />

  <!-- Catalogue Card / Bag Silhouette -->
  <rect x="26" y="36" width="38" height="44" rx="8" fill="url(#littlelystBag)" fill-opacity="0.25" stroke="url(#littlelystGrad)" stroke-width="4.5" />

  <!-- Bag Handles / L-Shape Fold -->
  <path d="M38 36 V 26 C 38 20.5 42.5 16 48 16 C 53.5 16 58 20.5 58 26 V 36" stroke="url(#littlelystGrad)" stroke-width="4.5" stroke-linecap="round" />

  <!-- Stylized L-Swoosh Link -->
  <path d="M20 74 C 20 50 34 32 64 32 C 78 32 86 42 86 42" stroke="url(#littlelystGrad)" stroke-width="5.5" stroke-linecap="round" filter="url(#glow)" />

  <!-- Instant Lightning / Sparkle Icon -->
  <polygon points="74,16 64,34 73,34 67,48 84,28 75,28" fill="url(#littlelystGrad)" filter="url(#glow)" />

  <!-- Product Tag Badge -->
  <circle cx="58" cy="48" r="4.5" fill="#34d399" />
</svg>
